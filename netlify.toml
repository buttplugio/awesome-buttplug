# The site lives in site/ so the repo root stays legible on GitHub. `publish` is
# resolved relative to `base`, so this is site/dist.
[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# apps.buttplug.io is a domain alias on this site; without this it serves a full
# duplicate copy that search engines index separately.
[[redirects]]
  from = "https://apps.buttplug.io/*"
  to = "https://awesome.buttplug.io/:splat"
  status = 301
  force = true
